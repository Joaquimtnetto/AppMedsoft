<link rel="stylesheet" href="/static/css/crud.css?v={{ build_version|default('1') }}">

<section class="crud-page" id="plano-empresa-page">
    <header class="crud-header">
        <div><h2>Plano Med</h2></div>
        <button class="crud-button" id="plano-empresa-incluir" type="button">
            <i class="fa fa-plus"></i> Incluir plano
        </button>
    </header>
    <div class="crud-toolbar">
        <div class="crud-field">
            <label for="plano-empresa-busca">Buscar plano</label>
            <input class="crud-input" id="plano-empresa-busca" type="search" placeholder="Nome ou código">
        </div>
        <button class="crud-button crud-button-secondary" id="plano-empresa-pesquisar" type="button">
            <i class="fa fa-search"></i> Pesquisar
        </button>
    </div>
    <div id="plano-empresa-result" class="crud-list" aria-live="polite"></div>
</section>

<script src="/static/js/crud.js?v={{ build_version|default('1') }}"></script>
<script src="/static/js/plano_empresa.js?v={{ build_version|default('1') }}"></script>
