<link rel="stylesheet" href="/static/css/crud.css?v={{ build_version|default('1') }}">

<section class="crud-page" id="empresa-page">
    <header class="crud-header">
        <div>
            <h2>Empresa</h2>
        </div>
        <button class="crud-button" id="empresa-incluir" type="button">
            <i class="fa fa-plus"></i> Incluir empresa
        </button>
    </header>

    <div class="crud-toolbar">
        <div class="crud-field">
            <label for="empresa-busca">Buscar empresa</label>
            <input class="crud-input" id="empresa-busca" type="search" placeholder="Nome, código ou banco">
        </div>
        <button class="crud-button crud-button-secondary" id="empresa-pesquisar" type="button">
            <i class="fa fa-search"></i> Pesquisar
        </button>
    </div>

    <div id="empresa-result" class="crud-list" aria-live="polite"></div>
</section>

<script src="/static/js/crud.js?v={{ build_version|default('1') }}"></script>
<script src="/static/js/empresa.js?v={{ build_version|default('1') }}"></script>
