<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#f2f5fa;font-family:Arial,sans-serif;color:#1c2a40">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f2f5fa;padding:28px 12px">
<tr><td align="center">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:620px;background:#fff;border-radius:14px;overflow:hidden">
    <tr><td style="padding:24px 28px;background:#347bea;color:#fff;font-size:25px;font-weight:bold">✚ MedSoft</td></tr>
    <tr><td style="padding:30px 28px">
      <h1 style="margin:0 0 22px;font-size:23px">Confirme sua presença na consulta</h1>
      <div style="border:1px solid #d9e2ef;border-radius:12px;padding:22px">
        <div style="font-size:18px;font-weight:bold;margin-bottom:6px">{{ profissional }}</div>
        <div style="color:#60728c;margin-bottom:20px">{{ clinica }}</div>
        <div style="margin:9px 0">👤 {{ procedimento }} para <strong>{{ paciente }}</strong></div>
        <div style="margin:9px 0">📅 {{ data }}</div>
        <div style="margin:9px 0">🕐 {{ hora }}</div>
      </div>
      <a href="{{ url }}" style="display:block;margin-top:24px;padding:15px;background:#347bea;color:#fff;text-align:center;text-decoration:none;border-radius:8px;font-weight:bold">Confirmar agendamento</a>
      <p style="margin:22px 0 0;color:#60728c;font-size:13px;line-height:1.5">Mensagem automática enviada pela MedSoft para confirmação do seu atendimento.</p>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
