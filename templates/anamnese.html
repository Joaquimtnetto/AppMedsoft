<link rel="stylesheet" href="/static/css/crud.css?v={{ build_version|default('1') }}">

<section class="crud-page anamnese-page" id="anamnese-page">
    <header class="crud-header">
        <div>
            <h2>Padrões</h2>
        </div>
        <div class="crud-header-actions">
            <button class="crud-button crud-button-secondary" id="anamnese-options" type="button" title="Visualizar padrões de todas as empresas">
                <i class="fa fa-list"></i> Opções
            </button>
            <button class="crud-button" id="anamnese-include" type="button" title="Incluir padrão">
                <i class="fa fa-plus"></i> Incluir
            </button>
        </div>
    </header>

    <div class="crud-toolbar">
        <div class="crud-field">
            <label for="anamnese-busca">Buscar padrão</label>
            <input class="crud-input" type="text" id="anamnese-busca" placeholder="Nome ou texto">
        </div>
        <button class="crud-button" id="btn-anamnese-ok" type="button">
            <i class="fa fa-search"></i> Buscar
        </button>
    </div>

    <div class="crud-list anamnese-list" id="anamnese-result" aria-live="polite"></div>
</section>

<script src="/static/js/crud.js?v={{ build_version|default('1') }}"></script>
<script src="/static/js/anamnese.js?v={{ build_version|default('1') }}"></script>
<script src="/static/js/navigation.js"></script>
