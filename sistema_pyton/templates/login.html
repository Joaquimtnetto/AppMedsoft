<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - MedSoft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='Med.png') }}" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(120deg, #eaf6ff 60%, #cbe7ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: auto;
      box-sizing: border-box;
      padding: 14px;
    }
    .login-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 38px;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }
    .login-bg-img {
      position: absolute;
      top: 0; right: 0;
      width: 160px;
      opacity: 0.13;
      z-index: 0;
      pointer-events: none;
    }
    .login-container {
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 28px 28px 24px 28px;
      border-radius: 18px;
      border: 1.5px solid #4f8cff;
      box-shadow: 0 8px 32px rgba(79,140,255,0.10), 0 1.5px 0 #4f8cff;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      animation: fadeIn 0.6s cubic-bezier(.4,1.4,.6,1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-logo {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #eaf6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px auto;
      box-shadow: 0 2px 8px rgba(79,140,255,0.10);
      font-size: 1.8em;
      color: #4f8cff;
    }
    .login-logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
    h2 {
      text-align: center;
      margin: 0 0 6px 0;
      color: #357ae8;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.4em;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .login-title-link {
      color: inherit;
      text-decoration: none;
    }
    .login-title-link:hover {
      text-decoration: underline;
    }
    .input-group {
      width: 100%;
      margin-bottom: 0.75rem;
      position: relative;
    }
    .input-group i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #4f8cff;
      font-size: 1.1em;
      opacity: 0.85;
    }
    .input-group input {
      width: 100%;
      padding: 0.58rem 0.7rem 0.58rem 2.3rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      background: #f7fbff;
      transition: border 0.2s;
      outline: none;
      box-sizing: border-box;
    }
    .input-group input:focus {
      border: 1.5px solid #4f8cff;
      background: #f0f7ff;
    }
    .login-subtitle {
      color: #357ae8;
      font-size: 1em;
      font-weight: 500;
      margin-bottom: 14px;
      text-align: center;
    }
    .input-group.password-group input { padding-right: 2.8rem; }
    .login-password-obscured { -webkit-text-security: disc; }
    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #4f8cff;
      cursor: pointer;
    }
    .password-toggle:hover { background: #e8f1ff; }
    .input-group .password-toggle i {
      position: static;
      transform: none;
      color: inherit;
      opacity: 1;
    }
    .login-btn {
      width: 100%;
      padding: 0.68rem;
      background: linear-gradient(90deg, #4f8cff 60%, #357ae8 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.13em;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 0.35rem;
      box-shadow: 0 2px 8px rgba(79,140,255,0.10);
      transition: background 0.2s, transform 0.1s;
    }
    .login-btn:hover {
      background: #357ae8;
      transform: translateY(-2px) scale(1.03);
    }
    .error-message {
      color: #e74c3c;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
      font-size: 1.01em;
    }
    .success-message {
      color: #27ae60;
      text-align: center;
      margin-bottom: 1rem;
      display: none;
      font-size: 1.01em;
    }
    .forgot-link {
      display: block;
      text-align: right;
      color: #4f8cff;
      text-decoration: underline;
      font-size: 0.98rem;
      margin-top: 0;
      cursor: pointer;
      transition: color 0.2s;
    }
    .forgot-link:hover {
      color: #357ae8;
    }
    .login-links {
      width: 100%;
      margin-top: 4px;
    }
    .login-contact {
      width: 100%;
      margin-top: 8px;
      font-size: 0.88em;
      color: #555;
      line-height: 1.3;
      text-align: center;
      word-break: break-word;
    }
    .login-help-button {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid #357ae8;
      background: #fff;
      color: #357ae8;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(79,140,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-help-button:hover {
      background: #eaf6ff;
    }
    .login-help-panel {
      position: fixed;
      top: 70px;
      right: 18px;
      bottom: 18px;
      width: min(520px, calc(100vw - 36px));
      background: #fff;
      border: 1px solid #cfe0f5;
      border-radius: 10px;
      box-shadow: 0 16px 42px rgba(25,70,130,0.18);
      z-index: 21;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .login-help-panel.show {
      display: flex;
    }
    .login-help-header {
      min-height: 42px;
      padding: 8px 10px 8px 14px;
      background: #f3f8ff;
      border-bottom: 1px solid #d8e6f7;
      color: #194f9b;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .login-help-close {
      border: 0;
      background: transparent;
      color: #194f9b;
      font-size: 1.4em;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
    }
    .login-help-frame {
      border: 0;
      width: 100%;
      flex: 1;
      background: #fff;
    }
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 8px;
      }
      .login-container {
        max-width: 94vw;
        padding: 14px 5vw 12px 5vw;
        border-radius: 14px;
      }
      .login-logo {
        width: 42px;
        height: 42px;
        margin-bottom: 4px;
      }
      .login-logo img {
        width: 34px;
        height: 34px;
      }
      h2 {
        font-size: 1.22em;
        margin-bottom: 3px;
      }
      .login-subtitle {
        font-size: 0.9em;
        margin-bottom: 10px;
      }
      .input-group {
        margin-bottom: 0.55rem;
      }
      .input-group input {
        padding-top: 0.52rem;
        padding-bottom: 0.52rem;
      }
      .login-btn {
        padding: 0.58rem;
      }
      .forgot-link {
        font-size: 0.88rem;
      }
      .login-contact {
        font-size: 0.78em;
        line-height: 1.22;
      }
      .build-info {
        margin-top: 8px;
        padding-top: 7px;
        font-size: 0.72em;
        line-height: 1.25;
      }
      .login-bg-img {
        width: 90px;
        top: unset;
        bottom: 0;
        right: 0;
        opacity: 0.10;
      }
      .login-help-button {
        top: 10px;
        right: 10px;
        width: 38px;
        height: 38px;
      }
      .login-help-panel {
        top: 56px;
        right: 8px;
        bottom: 8px;
        width: calc(100vw - 16px);
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .build-info {
      width: 100%;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #e6edf7;
      color: #66758c;
      font-size: 0.76em;
      line-height: 1.35;
      text-align: center;
    }
    .build-info .version-label {
      color: #357ae8;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .build-info {
        margin-top: 8px;
        padding-top: 7px;
        font-size: 0.72em;
        line-height: 1.25;
      }
    }
  </style>
</head>
<body>
  <button class="login-help-button" id="loginHelpButton" type="button" title="Ajuda" aria-label="Ajuda">?</button>
  <aside class="login-help-panel" id="loginHelpPanel" aria-label="Ajuda do sistema">
    <div class="login-help-header">
      <span>Ajuda</span>
      <button class="login-help-close" id="loginHelpClose" type="button" title="Fechar ajuda" aria-label="Fechar ajuda">&times;</button>
    </div>
    <iframe class="login-help-frame" id="loginHelpFrame" title="Ajuda do sistema"></iframe>
  </aside>
  <div class="login-shell">
    <div class="login-container">
      <div class="login-logo"><img src="{{ url_for('static', filename='Med.png') }}" alt="MedSoft"></div>
      <h2><a class="login-title-link" href="/">MedSoft</a></h2>
      <div class="login-subtitle">Soluções inteligentes para a área médica</div>
      <div id="error" class="error-message"></div>
      <div id="success" class="success-message"></div>
      <form id="login-form" autocomplete="off" data-lpignore="true">
        <div class="input-group">
          <i class="fa fa-user"></i>
          <input type="text" id="nome" name="nome" placeholder="Usuário" autocomplete="off" data-lpignore="true" data-1p-ignore required autofocus>
        </div>
        <div class="input-group password-group">
          <i class="fa fa-lock"></i>
          <input type="text" id="senha" name="codigo_acesso" class="login-password-obscured" placeholder="Senha" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore required>
          <button type="button" class="password-toggle" id="toggle-senha" title="Exibir senha" aria-label="Exibir senha" aria-pressed="false">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <button type="submit" class="login-btn">Entrar</button>
      </form>
      <div class="login-links">
        <a href="/esqueci-senha" class="forgot-link">Esqueci a senha</a>
      </div>
      <div class="login-contact">
        Deseja usar o sistema, entre em contato: <a href="https://medsoft.com.br/entre-em-contato-conosco/" target="_blank" style="color:#357ae8;font-weight:600;text-decoration:none;">https://medsoft.com.br/entre-em-contato-conosco/</a>
      </div>
      <div class="build-info" title="Identificação da versão instalada">
        <span><span class="version-label" id="loginBuildEnvironment">{{ build_environment }}:</span> <span id="loginBuildDatetime">{{ build_datetime }}</span></span>
      </div>
    </div>
  </div>
  <script>
    // Exibe ilustração só em telas médias/grandes
    function inicializarAjudaLogin() {
      var button = document.getElementById('loginHelpButton');
      var panel = document.getElementById('loginHelpPanel');
      var close = document.getElementById('loginHelpClose');
      var frame = document.getElementById('loginHelpFrame');
      if (!button || !panel || !close || !frame) return;
      button.onclick = function() {
        var open = panel.classList.toggle('show');
        if (open && !frame.getAttribute('src')) {
          frame.setAttribute('src', '/help.html');
        }
      };
      close.onclick = function() {
        panel.classList.remove('show');
      };
    }
    inicializarAjudaLogin();

    function atualizarVersaoLogin() {
      fetch('/api/version', { cache: 'no-store' })
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (!data.success) return;
          document.getElementById('loginBuildEnvironment').textContent = (data.build_environment || '') + ':';
          document.getElementById('loginBuildDatetime').textContent = data.build_datetime || '';
        })
        .catch(function() {});
    }
    atualizarVersaoLogin();
    window.setInterval(atualizarVersaoLogin, 60000);

    function updateLoginIllustration() {
      var illu = document.querySelector('.login-illustration');
      if (!illu) return;
      if (window.innerWidth > 700) {
        illu.style.display = 'block';
      } else {
        illu.style.display = 'none';
      }
    }
    updateLoginIllustration();
    window.addEventListener('resize', updateLoginIllustration);
  </script>
  <script>
    document.getElementById('toggle-senha').addEventListener('click', function () {
      const senhaInput = document.getElementById('senha');
      const showing = !senhaInput.classList.contains('login-password-obscured');
      senhaInput.classList.toggle('login-password-obscured', showing);
      this.setAttribute('aria-pressed', showing ? 'false' : 'true');
      this.setAttribute('aria-label', showing ? 'Exibir senha' : 'Ocultar senha');
      this.title = showing ? 'Exibir senha' : 'Ocultar senha';
      this.querySelector('i').className = showing ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      senhaInput.focus();
    });

    document.getElementById('login-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const senha = document.getElementById('senha').value;
      const errorDiv = document.getElementById('error');
      const successDiv = document.getElementById('success');
      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, senha })
        });
        const data = await resp.json();
        if (data.success) {
                    // Salva nome_medico no localStorage
                    if (data.nome_medico) {
                      localStorage.setItem('nome_medico', data.nome_medico);
                      console.log('[MedSoft] nome_medico salvo no localStorage:', data.nome_medico);
                    } else {
                      localStorage.removeItem('nome_medico');
                    }
          // Salva o nome do usuário exatamente como retornado pelo backend
          if (data.nome) {
            localStorage.setItem('usuario_logado', data.nome);
          } else {
            localStorage.setItem('usuario_logado', nome);
          }
          if (data.perfil) {
            localStorage.setItem('perfil', data.perfil);
          } else {
            localStorage.removeItem('perfil');
          }
          // Salva db_path retornado pelo backend
          if (data.db_path) {
            localStorage.setItem('db_path', data.db_path);
            console.log('[MedSoft] db_path salvo no localStorage:', data.db_path);
          } else {
            localStorage.removeItem('db_path');
          }
          if (data.idempresa !== undefined && data.idempresa !== null && data.idempresa !== '') {
            localStorage.setItem('idempresa', data.idempresa);
            localStorage.setItem('codclin', data.idempresa);
          } else {
            localStorage.removeItem('idempresa');
            localStorage.removeItem('codclin');
          }
          successDiv.textContent = 'Login realizado com sucesso!';
          successDiv.style.display = 'block';
          setTimeout(() => { window.location.href = 'menu.html'; }, 700);
        } else {
          errorDiv.textContent = data.message || 'Erro ao fazer login.';
          errorDiv.style.display = 'block';
        }
      } catch (e) {
        errorDiv.textContent = 'Erro de conexão com o servidor.';
        errorDiv.style.display = 'block';
      }
    });
  </script>
  <script src="/static/js/navigation.js"></script>
</body>
</html>
